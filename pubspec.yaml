name: chazin_food_mobile
description: "Chazin Food - Aplicación móvil para gestión de productos, ventas y operaciones."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP Client
  dio: ^5.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Typography
  google_fonts: ^6.2.1

  # Formatting
  intl: ^0.20.2

  # UI Enhancements
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  animated_text_kit: ^4.2.3

  # Image Picking
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/chazin_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "Chazin Food imagen para el logo del mobile.png"
  adaptive_icon_background: "#E52D27"
  adaptive_icon_foreground: "Chazin Food imagen para el logo del mobile.png"
  web:
    generate: true
    image_path: "Chazin Food imagen para el logo del mobile.png"
