name: Build Android APK (Release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (Zulu OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --dart-define=API_URL=https://backend-web-chazin-food.onrender.com/api

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChazinFood-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

